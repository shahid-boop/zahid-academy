name: zahid_academy
description: Zahid Architecture Academy - complete Flutter app with Firebase, verified payments and admin uploads.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  firebase_storage: ^14.1.0
  image_picker: ^1.2.4
  file_picker: ^13.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
