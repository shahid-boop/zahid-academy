name: Build Android APK & AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Flutter release build
    runs-on: ubuntu-latest

    # Secrets ko env me daalte hain (secrets ko 'if' me directly use nahi kar sakte).
    env:
      ANDROID_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
      FIREBASE_OPTIONS_B64: ${{ secrets.FIREBASE_OPTIONS_DART }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub ubuntu runners me Android SDK pehle se installed hota hai.
      # android-actions/setup-android@v3 ab fail karta hai (purana 'tools' package
      # SDK manager se hataya gaya) - isliye directly use karte hain.
      - name: Configure preinstalled Android SDK
        run: |
          SDK="/usr/local/lib/android/sdk"
          CMDLINE=$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -1)
          if [ -z "$CMDLINE" ]; then
            echo "Android SDK cmdline-tools not found on runner" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$CMDLINE" >> "$GITHUB_ENV"
          echo "$(dirname "$CMDLINE")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "Using SDK manager: $CMDLINE"

      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version / doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Generate Android platform folder if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.zahid .
          else
            echo "android/ already present, skipping flutter create"
          fi

      - name: Add google-services.json (optional, from secret)
        if: env.GOOGLE_SERVICES_B64 != ''
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_B64" | base64 --decode > android/app/google-services.json
          echo "google-services.json added"

      - name: Add real firebase_options.dart (optional, from secret)
        if: env.FIREBASE_OPTIONS_B64 != ''
        run: |
          printf '%s' "$FIREBASE_OPTIONS_B64" | base64 --decode > lib/firebase_options.dart
          echo "firebase_options.dart replaced with real config"

      - name: Decode signing keystore (optional, from secret)
        if: env.ANDROID_STORE_PASSWORD != ''
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "KEYSTORE_BASE64 not set -> building without custom signing"
          else
            printf '%s' '${{ secrets.KEYSTORE_BASE64 }}' | base64 --decode > "$RUNNER_TEMP/zahid-upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/zahid-upload.jks" >> "$GITHUB_ENV"
            echo "Keystore decoded"
          fi

      - name: Configure applicationId, permissions and signing
        env:
          ANDROID_APPLICATION_ID: com.zahid.academy
        run: python3 scripts/configure_android.py

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (report only)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB (Play Store)
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zahid-academy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: zahid-academy-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
